name: Keep Render Backend Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          set -euo pipefail
          raw_url="${RENDER_HEALTH_URL:-}"
          if [ -z "$raw_url" ]; then
            echo "Missing repository secret: RENDER_HEALTH_URL"
            exit 1
          fi

          base_url="${raw_url%/}"
          if [[ "$base_url" == *"/health" ]]; then
            base_url="${base_url%/health}"
          fi

          curl --fail --silent --show-error --max-time 30 "${base_url}/health"
          echo
